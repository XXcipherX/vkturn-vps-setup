[Interface]
Address = $FREE_TURN_WG_SERVER_ADDRESS/24
ListenPort = $FREE_TURN_WG_PORT
PrivateKey = $FREE_TURN_WG_SERVER_PRIVATE_KEY
MTU = 1420
PostUp = sysctl -w net.ipv4.ip_forward=1 >/dev/null; iptables -w -C FORWARD -i %i -j ACCEPT 2>/dev/null || iptables -w -I FORWARD -i %i -j ACCEPT; iptables -w -C FORWARD -o %i -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -w -I FORWARD -o %i -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -w -t nat -C POSTROUTING -s $FREE_TURN_WG_CIDR -o $FREE_TURN_WAN_IFACE -j MASQUERADE 2>/dev/null || iptables -w -t nat -A POSTROUTING -s $FREE_TURN_WG_CIDR -o $FREE_TURN_WAN_IFACE -j MASQUERADE
PostDown = iptables -w -D FORWARD -i %i -j ACCEPT 2>/dev/null || true; iptables -w -D FORWARD -o %i -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true; iptables -w -t nat -D POSTROUTING -s $FREE_TURN_WG_CIDR -o $FREE_TURN_WAN_IFACE -j MASQUERADE 2>/dev/null || true

[Peer]
PublicKey = $FREE_TURN_WG_CLIENT_PUBLIC_KEY
AllowedIPs = $FREE_TURN_WG_CLIENT_ADDRESS/32
