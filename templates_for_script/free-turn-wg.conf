[Interface]
Address = $FREE_TURN_WG_SERVER_ADDRESS/24
ListenPort = $FREE_TURN_WG_PORT
PrivateKey = $FREE_TURN_WG_SERVER_PRIVATE_KEY
MTU = 1420
PostUp = /usr/local/lib/free-turn-proxy/apply-wg-firewall.sh apply %i $FREE_TURN_WG_CIDR $FREE_TURN_WAN_IFACE
PostDown = /usr/local/lib/free-turn-proxy/apply-wg-firewall.sh remove %i $FREE_TURN_WG_CIDR $FREE_TURN_WAN_IFACE
